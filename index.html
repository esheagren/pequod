<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pequod: whole books, chapter by chapter, with a reader's marginalia.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="Pequod">
<meta name="application-name" content="Pequod">
<meta name="theme-color" content="#0C1218">
<meta charset="utf-8">
<title>Pequod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300;1,9..144,500&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Gentium+Book+Plus:ital@0;1&display=swap">
<style>
:root{
  --bg:#EEF1EC; --bg2:#E3E8E2; --panel:#F6F8F4; --ink:#1B2229; --ink2:#4A555C; --ink3:#7C868C;
  --rule:#CBD3CD; --accent:#2E5F6B; --accent-soft:#D6E3E5; --line:#9A3B2E; --line-soft:#F1DAD5;
  --essay:#E8EDE6; --sel:#DCE8E9;
  --m0:#2E5F6B; --m1:#7A6A45; --m2:#5C7A62; --m3:#9A3B2E; --m4:#6B5B8A; --m5:#8A5A3C; --m6:#4A6FA5;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1218; --bg2:#101922; --panel:#121B24; --ink:#D9DED6; --ink2:#A4AEB0; --ink3:#6E7A80;
  --rule:#233039; --accent:#E8E2CB; --accent-soft:#1E2E36; --line:#D9705E; --line-soft:#3A2420;
  --essay:#111A22; --sel:#1B2A33;
  --m0:#7FB3BE; --m1:#C9B37E; --m2:#8FB896; --m3:#D9705E; --m4:#A99BD0; --m5:#D2A079; --m6:#8FB0DC;
}}
:root[data-theme="dark"]{
  --bg:#0C1218; --bg2:#101922; --panel:#121B24; --ink:#D9DED6; --ink2:#A4AEB0; --ink3:#6E7A80;
  --rule:#233039; --accent:#E8E2CB; --accent-soft:#1E2E36; --line:#D9705E; --line-soft:#3A2420;
  --essay:#111A22; --sel:#1B2A33;
  --m0:#7FB3BE; --m1:#C9B37E; --m2:#8FB896; --m3:#D9705E; --m4:#A99BD0; --m5:#D2A079; --m6:#8FB0DC;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--line);outline-offset:2px}
::selection{background:var(--sel)}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:19rem minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:100vh}
.mast{grid-column:1/-1;display:flex;align-items:baseline;gap:1.5rem;padding:.8rem 1.4rem;border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0;z-index:20}
.mast h1{font-family:var(--display);font-weight:500;font-size:1.15rem;margin:0;letter-spacing:.01em;font-variation-settings:"opsz" 30}
.mast h1 a{color:var(--ink);text-decoration:none}
.tabs{display:flex;gap:.2rem;margin-left:auto}
.tabs button{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .7rem;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--line)}
.leagues{font-family:var(--mono);font-size:.72rem;color:var(--ink3);letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ---------- chart (sidebar) ---------- */
:root{--mast-h:3.1rem}
.chart{border-right:1px solid var(--rule);background:var(--bg2);position:sticky;top:var(--mast-h);height:calc(100vh - var(--mast-h));overflow-y:auto;padding:1rem 0 3rem}
/* cover (main page): no chapter chart, content takes the full width */
body.on-cover .app{grid-template-columns:minmax(0,1fr)}
body.on-cover .chart,body.on-cover .menu{display:none}
body.at-home .mast{display:none}
body.at-home .home{min-height:95vh}
.home{min-height:calc(100vh - var(--mast-h) - 5rem);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.home .word{font-family:var(--display);font-weight:300;font-size:clamp(4rem,13vw,8.5rem);line-height:1;letter-spacing:-.02em;font-variation-settings:"opsz" 144;margin:0}
.home .sub{font-family:var(--display);font-style:italic;color:var(--ink2);font-size:1.1rem;margin:1.2rem 0 0}
.home .down{position:absolute;bottom:1.5rem;font-family:var(--mono);font-size:.9rem;color:var(--ink3);background:none;border:0;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.home .down{animation:none}}
.shelf{min-height:70vh;display:flex;flex-direction:column;gap:1.2rem;align-items:center;justify-content:center;padding:3rem 1rem 6rem}
.bookcard{width:100%}
.bookcard{display:grid;grid-template-columns:auto 1fr;gap:1.8rem;align-items:center;max-width:36rem;border:1px solid var(--rule);background:var(--panel);padding:1.8rem 2rem;text-align:left;cursor:pointer;transition:border-color .15s}
.bookcard:hover{border-color:var(--accent)}
.bookcard svg{width:78px;height:78px;flex:none}
.bookcard .t{font-family:var(--display);font-weight:500;font-size:1.5rem;line-height:1.15;font-variation-settings:"opsz" 72}
.bookcard .t em{font-weight:300;font-style:italic}
.bookcard .a{color:var(--ink2);font-size:.9rem;margin-top:.3rem}
.bookcard .m{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:.8rem}
@media (max-width:560px){.bookcard{grid-template-columns:1fr;gap:1rem}}
.chart .find{margin:0 1rem .9rem;position:relative}
.chart input{width:100%;font-family:var(--mono);font-size:.78rem;padding:.45rem .6rem;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:2px}
.chart input::placeholder{color:var(--ink3)}
.mv{margin:0}
.mv h3{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:1.1rem 1rem .35rem;font-weight:500}
.mv h3 span{color:var(--ink2)}
.mv ol{list-style:none;margin:0;padding:0;position:relative}
.mv ol::before{content:"";position:absolute;left:calc(1rem + 1.6rem + .5rem + .4rem);top:0;bottom:0;width:1px;background:var(--rule)}
.mv li{position:relative}
.mv li button{display:grid;grid-template-columns:1.6rem .8rem 1fr;gap:.5rem;align-items:center;width:100%;text-align:left;padding:.24rem 1rem;font-size:.86rem;line-height:1.35;color:var(--ink2)}
.mv li button:hover{background:var(--panel);color:var(--ink)}
.mv li button .n{font-family:var(--mono);font-size:.66rem;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.mv li button .dot{width:7px;height:7px;border-radius:50%;background:var(--bg2);border:1px solid var(--rule);justify-self:center;position:relative;z-index:1}
.mv li.read button .dot{background:var(--accent);border-color:var(--accent)}
.mv li.cur button{color:var(--ink);background:var(--panel)}
.mv li.cur button .dot{background:var(--line);border-color:var(--line);box-shadow:0 0 0 3px var(--line-soft)}
.hits{margin:0 1rem;padding:0;list-style:none;font-size:.82rem}
.hits li{padding:.4rem 0;border-bottom:1px solid var(--rule)}
.hits li button{text-align:left;color:var(--ink2);line-height:1.4}
.hits li b{color:var(--ink);font-weight:400;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;display:block;margin-bottom:.15rem}
.hits mark{background:var(--line-soft);color:inherit;padding:0 .1em}
.hits .none{color:var(--ink3);font-style:italic;border:0}

/* ---------- page ---------- */
.page{padding:2.5rem 3rem 6rem;min-width:0}
.view{display:none}.view.on{display:block}
.reading{max-width:66ch;margin:0 auto}
.reading.wide{max-width:calc(66ch + 24rem)}
.chhead{margin:0 0 2.6rem}
.chhead .kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);display:flex;gap:1rem;align-items:baseline}
.chhead .kicker .mvname{color:var(--accent)}
.chhead h2{font-family:var(--display);font-weight:300;font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.05;margin:.5rem 0 0;letter-spacing:-.01em;text-wrap:balance;font-variation-settings:"opsz" 144}
.chhead .jump{display:inline-block;margin-top:1rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--ink2);text-decoration:none;border-bottom:1px dotted var(--ink3)}
.chhead .jump:hover{color:var(--accent);border-color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,66ch) 1fr;column-gap:2.2rem;align-items:start}
.row p{margin:0 0 1.15em;max-width:66ch;hyphens:auto}
.row p.verse{white-space:pre-line}
.chbody > .row:first-of-type p::first-letter{font-family:var(--display);font-weight:500;font-size:3.2em;float:left;line-height:.82;padding:.08em .08em 0 0;color:var(--accent);font-variation-settings:"opsz" 144}
.ann{background:linear-gradient(transparent 82%,var(--line-soft) 82%);text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:.16em;text-decoration-skip-ink:none;cursor:pointer;transition:background .15s}
.ann sup{text-decoration:none}
.ann:hover,.ann.hot{background:var(--line-soft)}
.ann sup{font-family:var(--mono);font-size:.55em;color:var(--line);margin-left:.15em;font-weight:500;vertical-align:.5em}
.notes{display:flex;flex-direction:column;gap:.7rem;padding-top:.15rem}
.note{font-size:.84rem;line-height:1.5;color:var(--ink2);border-left:2px solid var(--line);padding:.05rem 0 .05rem .75rem;transition:color .15s}
.note.hot{color:var(--ink)}
.note .q{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--line);margin-bottom:.25rem;font-variant-numeric:tabular-nums}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--rule);box-shadow:0 -12px 40px rgba(0,0,0,.35);padding:1rem 1.2rem calc(1.1rem + env(safe-area-inset-bottom));max-height:55vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease-out;font-size:.92rem;line-height:1.55;color:var(--ink)}
.sheet.on{transform:none}
.sheet .q{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;color:var(--line);margin:0 2rem .5rem 0}
.sheet .x{position:absolute;top:.55rem;right:.8rem;font-family:var(--mono);font-size:1rem;color:var(--ink3);padding:.2rem .5rem}
.sheet-scrim{position:fixed;inset:0;z-index:29;display:none}
.sheet-scrim.on{display:block}
.ann.open{background:var(--line-soft)}
.essay{margin:3.5rem 0 0;padding:2rem 2.2rem 2.2rem;background:var(--essay);border-top:1px solid var(--rule);position:relative;max-width:66ch}
.essay::before{content:"";position:absolute;left:0;top:-1px;width:4rem;height:1px;background:var(--line)}
.essay h3{font-family:var(--display);font-style:italic;font-weight:300;font-size:1.55rem;margin:0 0 .3rem;font-variation-settings:"opsz" 72}
.essay .who{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 1.3rem}
.essay p{margin:0 0 1em;font-size:.97rem;line-height:1.66;color:var(--ink)}
.essay p:last-child{margin-bottom:0}
.essay .missing{font-style:italic;color:var(--ink3)}
.chnav{display:flex;justify-content:space-between;gap:1rem;margin:2.5rem 0 0;padding-top:1.2rem;border-top:1px solid var(--rule);max-width:66ch;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em}
.chnav button{color:var(--accent);text-align:left;line-height:1.5}
.chnav button span{display:block;color:var(--ink3);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase}
.chnav .next{text-align:right}
.markread{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--rule);padding:.4rem .8rem;border-radius:2px;margin-top:1.5rem}
.markread:hover{border-color:var(--accent);color:var(--accent)}
.markread.done{color:var(--accent);border-color:var(--accent)}

a.xref{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft);transition:border-color .15s}
a.xref:hover{border-bottom-color:var(--accent)}
.essay a.xref{font-style:italic}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{background:var(--line-soft);box-shadow:0 0 0 6px var(--line-soft)}100%{background:transparent;box-shadow:none}}
.threads{max-width:66ch;margin:1.6rem 0 0;padding:1.4rem 2.2rem 1.6rem;border-top:1px dashed var(--rule)}
.threads h3{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 .9rem;font-weight:500}
.threads ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.threads li{display:grid;grid-template-columns:11rem 1fr;gap:1rem;font-size:.88rem;line-height:1.5;align-items:baseline}
.threads li a.xref{font-family:var(--display);font-size:.98rem;font-weight:500;font-variation-settings:"opsz" 30;border:0}
.threads li span{color:var(--ink2)}
.threads .inc{margin:1.1rem 0 0;font-size:.8rem;color:var(--ink3);font-style:italic}
@media (max-width:860px){.threads{padding:1.2rem 1.2rem}.threads li{grid-template-columns:1fr;gap:.15rem}}
/* ---------- audio ---------- */
::highlight(narr){background:var(--sel);color:var(--ink)}
::highlight(narrword){background:var(--accent-soft)}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;align-items:center;gap:.9rem;padding:.55rem 1rem calc(.55rem + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--rule);font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--ink2)}
.abar.on{display:flex}
.abar .play{width:2.2rem;height:2.2rem;border:1px solid var(--accent);border-radius:50%;color:var(--accent);display:grid;place-items:center;font-size:.9rem;flex:none}
.abar .time{font-variant-numeric:tabular-nums;white-space:nowrap}
.abar .bar{flex:1;height:2px;background:var(--rule);position:relative;cursor:pointer}
.abar .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.abar select,.abar label{font:inherit;color:inherit;background:none;border:0}
.abar label{display:flex;align-items:center;gap:.35rem;white-space:nowrap;cursor:pointer}
.abar .who{color:var(--ink3);white-space:nowrap}
body.has-audio .page{padding-bottom:8rem}
body.has-audio .chart{padding-bottom:5rem}
body.has-audio .sheet{bottom:var(--abar-h,3.4rem)}
.abar{z-index:31}
.chhead .listen{display:inline-block;margin:1rem 0 0 1.2rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--accent);border-bottom:1px dotted var(--accent);text-decoration:none}
@media (max-width:860px){.abar .who,.abar .time .dur{display:none}.abar{gap:.6rem}}

/* ---------- cover ---------- */
.cover{max-width:66ch;margin:0 auto}
.cover .kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.cover h2{font-family:var(--display);font-weight:300;font-size:clamp(2.6rem,6vw,4.6rem);line-height:.98;margin:.6rem 0 .2rem;letter-spacing:-.015em;font-variation-settings:"opsz" 144;text-wrap:balance}
.cover h2 em{font-style:italic;font-weight:300}
.cover .by{font-family:var(--display);font-style:italic;font-size:1.15rem;color:var(--ink2);margin:0 0 2.4rem}
.cover p{font-size:1rem;color:var(--ink);margin:0 0 1em}
.cover .rope{height:1px;background:var(--rule);margin:2.4rem 0;position:relative}
.cover .rope::after{content:"";position:absolute;left:0;top:0;width:4rem;height:1px;background:var(--line)}
.mvcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin:1.5rem 0 0}
.mvcard{display:block;text-align:left;border:1px solid var(--rule);background:var(--panel);padding:1rem 1.1rem 1.1rem;border-radius:2px;transition:border-color .15s}
.mvcard:hover{border-color:var(--accent)}
.mvcard .n{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:.35rem;font-variant-numeric:tabular-nums}
.mvcard .t{font-family:var(--display);font-size:1.25rem;font-weight:500;display:block;margin-bottom:.35rem;font-variation-settings:"opsz" 48}
.mvcard .d{font-size:.84rem;color:var(--ink2);line-height:1.5}
.resume{margin-top:2.2rem;font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;color:var(--accent);border-bottom:1px solid var(--accent)}

/* ---------- voyage map ---------- */
.cmap{margin:2rem 0 0}
.cmap svg{width:100%;height:auto;display:block}
.cm-trail{stroke:var(--rule);stroke-width:1.4;fill:none;stroke-dasharray:1 7;stroke-linecap:round}
.cm-edge{stroke:var(--accent);fill:none;opacity:.13;stroke-width:1}
svg.focus .cm-edge{opacity:.04}
svg.focus .cm-edge.lit{stroke:var(--line);opacity:.9;stroke-width:1.6}
.cm-node{cursor:pointer}
.cm-node circle{stroke:var(--bg);stroke-width:2}
.cm-node .num{font-family:'IBM Plex Mono',monospace;fill:var(--bg);font-weight:500;pointer-events:none}
.cm-node .ttl{font-family:'Libre Caslon Text',Georgia,serif;fill:var(--ink2)}
.cm-node:hover .ttl,.cm-node.lit .ttl{fill:var(--ink)}
svg.focus .cm-node:not(.lit):not(.src){opacity:.35}
.cm-node.src circle{stroke:var(--line);stroke-width:2.5}
.cm-mv{font-family:'IBM Plex Mono',monospace;fill:var(--ink3);letter-spacing:.18em}
.cm-legend{display:flex;flex-wrap:wrap;gap:1.1rem;margin:1.6rem 0 0;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.cm-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.45rem}
.cm-hint{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--ink3);margin:.6rem 0 0}
.coverhead{max-width:66ch}

/* dense commentary: margin notes are two-line teasers that open over the page, so long notes do not push the verse apart */
body.dense .notes{gap:.4rem}
body.dense .note{position:relative;height:4.5em;border-left:0;padding:0}
body.dense .note .ni{position:absolute;left:0;right:0;top:0;max-height:4.5em;overflow:hidden;border-left:2px solid var(--line);padding:.05rem 0 .05rem .75rem;cursor:pointer}
body.dense .note .ni::after{content:"";position:absolute;left:2px;right:0;bottom:0;height:1.3em;background:linear-gradient(transparent,var(--bg))}
body.dense .note.hot .ni,body.dense .note.pin .ni{max-height:none;background:var(--panel);z-index:6;box-shadow:0 12px 32px rgba(0,0,0,.4);padding:.55rem .8rem .7rem .75rem;color:var(--ink)}
body.dense .note.hot .ni::after,body.dense .note.pin .ni::after{display:none}
body.dense .note.pin .ni{border-left-color:var(--accent)}
.grk{font-family:'Gentium Book Plus','Gentium Plus','New Athena Unicode',Georgia,serif;font-size:1.06em;font-style:normal}
.spk{font-family:var(--mono);font-size:.7em;letter-spacing:.12em;color:var(--ink3)}

/* ---------- crew ---------- */
.crew{max-width:78ch;margin:0 auto}
.crew h2{font-family:var(--display);font-weight:300;font-size:2.6rem;margin:0 0 .3rem;font-variation-settings:"opsz" 144}
.crew > p{color:var(--ink2);margin:0 0 2rem;max-width:66ch}
.crew h3{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:2.4rem 0 .8rem;padding-bottom:.4rem;border-bottom:1px solid var(--rule);font-weight:500}
.person{display:grid;grid-template-columns:13rem 1fr;gap:1.6rem;padding:1.1rem 0;border-bottom:1px solid var(--rule);align-items:start}
.person .id .nm{font-family:var(--display);font-size:1.35rem;font-weight:500;line-height:1.15;font-variation-settings:"opsz" 48}
.person .id .rl{font-size:.84rem;color:var(--ink2);margin-top:.25rem;line-height:1.4}
.person .id .fa{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;color:var(--ink3);margin-top:.5rem}

function fmt(text){
  // escape, then resolve [[...]] cross-references and *italics*
  let h=esc(text);
  h=h.replace(/\[\[([a-z0-9]+)(?::([^\]|]+))?(?:\|([^\]]+))?\]\]/g,(m,id,q,label)=>{
    if(byId[id]==null) return label||m;
    const c=CH[byId[id]]; const lab=label||((ref(c)?ref(c)+', ':'')+c.title);
    return '<a class="xref" href="#'+id+'" data-go="'+id+'"'+(q?' data-q="'+q.replace(/"/g,'&quot;')+'"':'')+'>'+lab+'</a>';
  });
  h=h.replace(/(^|[\s(“‘"'—])_([^_<>]{1,90}?)_(?=[\s.,;:!?)”’"'—]|$)/g,'$1<em>$2</em>');
  h=h.replace(/[\u0370-\u03FF\u1F00-\u1FFF][\u0370-\u03FF\u1F00-\u1FFFʼ’ ]*[\u0370-\u03FF\u1F00-\u1FFFʼ’]|[\u0370-\u03FF\u1F00-\u1FFF]/g,m=>'<span class="grk" lang="grc">'+m+'</span>');
  return h;
}

/* ---- annotation wrapping ---- */
function wrapAnnotations(paras, anns){
  // returns [{html, notes:[{n,quote,note}]}] per paragraph; annotation numbering is per chapter
  const out = paras.map(p=>({html:null, notes:[], raw:p}));
  let n=0;
  const placed = [];
  anns.forEach(a=>{
    for(let i=0;i<paras.length;i++){
      const idx=paras[i].indexOf(a.quote);
      if(idx>=0){ n++; placed.push({pi:i, idx, len:a.quote.length, n, quote:a.quote, note:a.note}); break; }
    }
  });
  out.forEach((o,i)=>{
    const here = placed.filter(x=>x.pi===i).sort((a,b)=>a.idx-b.idx);
    let html='', cursor=0, lastEnd=-1;
    here.forEach(x=>{
      if(x.idx<lastEnd){ return; } // overlapping — skip wrapping, keep note
      html += esc(o.raw.slice(cursor,x.idx));
      html += '<span class="ann" data-n="'+x.n+'" tabindex="0" role="button" aria-label="Note '+x.n+'">'+esc(o.raw.slice(x.idx,x.idx+x.len))+'<sup>'+x.n+'</sup></span>';
      cursor=x.idx+x.len; lastEnd=cursor;
    });
    html += esc(o.raw.slice(cursor));
    o.html=html.replace(/_([^_<>]{1,200}?)_/g,'<em>$1</em>'); if(META.speakers) o.html=o.html.replace(/^([A-Z][A-Z’' .-]{1,30}[.:])(?=\n| )/,'<span class="spk">$1</span>'); o.notes=here;
  });
  return out;
}

const PERSONS=[...PEOPLE,...(META.references||[])];
function personAliases(){
  const aliases=new Map();
  PERSONS.forEach((p,index)=>(p.aliases||[p.name]).forEach(name=>{
    const key=name.toLocaleLowerCase();
    if(!aliases.has(key))aliases.set(key,index);else if(aliases.get(key)!==index)aliases.set(key,null);
  }));
  return aliases;
}
const PERSON_ALIASES=personAliases();
function findPersonMentions(text){
  const names=[...PERSON_ALIASES.keys()].filter(n=>PERSON_ALIASES.get(n)!=null).sort((a,b)=>b.length-a.length);
  if(!names.length)return [];
  const escapeRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const pattern=new RegExp('(^|[^\\p{L}\\p{N}_])('+names.map(escapeRegex).join('|')+')(?=$|[^\\p{L}\\p{N}_])','giu');
  const mentions=[];
  for(const m of text.matchAll(pattern)){
    const name=m[2],index=PERSON_ALIASES.get(name.toLocaleLowerCase());
    // Generic cast roles are cues only when printed as speaker labels.
    if(/^(guard|messenger|second messenger|priest|chorus|herdsman|jailer)$/i.test(name)&&name!==name.toUpperCase())continue;
    mentions.push({start:m.index+m[1].length,end:m.index+m[1].length+name.length,index});
  }
  return mentions;
}
function linkPeople(){
  const root=$('#folio-flow'),walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(walker.nextNode()){const n=walker.currentNode;if(!n.parentElement.closest('sup'))nodes.push(n)}
  nodes.forEach(node=>{
    const matches=findPersonMentions(node.data);if(!matches.length)return;
    const fragment=document.createDocumentFragment();let cursor=0;
    matches.forEach(m=>{
      fragment.append(document.createTextNode(node.data.slice(cursor,m.start)));
      const button=document.createElement('button');button.className='person-reference';button.dataset.person=m.index;
      button.textContent=node.data.slice(m.start,m.end);button.setAttribute('aria-label','About '+PERSONS[m.index].name);
      fragment.append(button);cursor=m.end;
    });
    fragment.append(document.createTextNode(node.data.slice(cursor)));node.replaceWith(fragment);
  });
  // A name can occur inside a passage note; give each action its own focus target.
  root.querySelectorAll('.ann').forEach(a=>{
    if(!a.querySelector('.person-reference'))return;
    a.removeAttribute('role');a.removeAttribute('aria-label');a.tabIndex=-1;
    const walker=document.createTreeWalker(a,NodeFilter.SHOW_TEXT),texts=[];
    while(walker.nextNode()){const n=walker.currentNode;if(!n.parentElement.closest('.person-reference,sup')&&n.data.trim())texts.push(n)}
    texts.forEach(n=>{const span=document.createElement('span');span.className='annotation-trigger';span.setAttribute('role','button');span.tabIndex=0;span.setAttribute('aria-label','Note '+a.dataset.n);n.replaceWith(span);span.append(n)});
    const sup=a.querySelector('sup');if(sup){sup.setAttribute('role','button');sup.tabIndex=0;sup.setAttribute('aria-label','Note '+a.dataset.n)}
  });
  root.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();showPerson(+b.dataset.person,b)}));
}
function showPerson(index,target=null){
  if(!PERSONS[index])return;
  const direct=target?.closest('.ann');

  R.person={index,note};R.mode='person';updateDock();
}

function renderChapter(id, pageHint=null){
  const i=byId[id],c=CH[i],cm=CM[id]||{},m=mvOf(i),rows=wrapAnnotations(c.paras,cm.annotations||[]);
  finishPaperTurn();
  folioObserver?.disconnect();clearTimeout(readerResize);
  R.id=id;R.page=0;R.selected=null;R.mode='notes';R.person=null;R.anchor=null;
  A.notes={};rows.forEach(r=>r.notes.forEach(n=>A.notes[n.n]=n));
  $('#voyage').innerHTML='<div class="reader-layout"><article class="reading" aria-label="'+esc(c.title)+'"><div class="book-surface"><div class="folio-window" id="folio-window"><div class="folio-flow chbody" id="folio-flow">'+rows.map((r,pi)=>'<div class="row"><p data-para="'+pi+'"'+(/\n/.test(r.raw)||id==='extracts'||id==='etymology'?' class="verse"':'')+'>'+r.html+'</p></div>').join('')+'</div></div><button class="page-turn prev" id="turn-prev" aria-label="Previous page">‹</button><button class="page-turn next" id="turn-next" aria-label="Next page">›</button><footer class="folio-footer"><button data-cover>'+esc(META.title)+'</button>'+(D.audio?.[id]?'<button class="listen" data-listen>▶ listen &amp; follow</button>':'')+'<span class="reading-hint">← turn the page →</span><label class="page-count"><span id="page-label"></span> <select id="page-select" aria-label="Go to page"></select></label></footer></div><section class="notes-dock" aria-label="Notes"><div class="dock-toolbar"><h2 id="dock-notes">Notes</h2><div class="note-picker" id="note-picker"><span id="note-count"></span><select id="note-select" aria-label="Select a note on this page"></select></div></div><div class="dock-content" id="dock-content" role="region" aria-labelledby="dock-notes" tabindex="0"></div></section></article><div class="resource-resizer" id="resource-resizer" role="separator" aria-orientation="vertical" aria-label="Resize resources panel" aria-controls="resource-panel" aria-hidden="true" tabindex="-1" title="Drag to resize; double-click to reset"></div><aside class="resource-panel" id="resource-panel" aria-label="Resources" aria-hidden="true" inert><div class="resource-inner">'+contextHTML(id)+'</div></aside></div>';
  setupResourceResize();
  $('#turn-prev').addEventListener('click',()=>turnPage(-1));$('#turn-next').addEventListener('click',()=>turnPage(1));
  $('#page-select').addEventListener('change',e=>setPage(+e.target.value));
  $('#note-select').addEventListener('change',e=>selectNote(+e.target.value));
  linkPeople();
  $('#voyage').querySelectorAll('.ann').forEach(a=>{
    const activate=()=>{if(A.notes[a.dataset.n])selectNote(+a.dataset.n)};
    a.addEventListener('click',activate);a.addEventListener('keydown',e=>{if(!e.target.closest('.person-reference')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate()}});
  });
  $('#voyage').querySelectorAll('button[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  $('#voyage').querySelectorAll('[data-cover]').forEach(b=>b.addEventListener('click',()=>go('cover')));
  let touch=null;
  $('#folio-window').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY}}, {passive:true});
  $('#folio-window').addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&!getSelection()?.toString())turnPage(dx<0?1:-1);touch=null},{passive:true});
  setupAudio(id,rows);
  $('#voyage [data-listen]')?.addEventListener('click',audioPlay);
  const saved=store.get('position',null);
  const anchor=pageHint==null&&saved?.id===id?saved:null;
  paginate(anchor,pageHint);
  if(document.fonts.status!=='loaded')document.fonts.ready.then(()=>{if(R.id===id&&document.body.classList.contains('on-reader'))paginate(R.anchor||anchor,R.anchor?null:pageHint)});
  markRail(id);
  let width=$('#folio-window').clientWidth,height=$('#folio-window').clientHeight;
  folioObserver=new ResizeObserver(()=>{
    const win=$('#folio-window');if(!win||R.id!==id||resourceDrag)return;if(win.clientWidth===width&&win.clientHeight===height)return;
    width=win.clientWidth;height=win.clientHeight;
    clearTimeout(readerResize);
    readerResize=setTimeout(()=>{if(R.id===id&&document.body.classList.contains('on-reader'))paginate(R.anchor)},100);
  });
  folioObserver.observe($('#folio-window'));
}

function paginate(anchor=null,hint=null){
  const flow=$('#folio-flow'),win=$('#folio-window');if(!flow||!win.clientWidth||!win.clientHeight)return;
  finishPaperTurn();
  const style=getComputedStyle(flow),line=parseFloat(style.lineHeight);
  flow.style.height=Math.max(line,Math.floor(win.clientHeight/line)*line)+'px';
  R.stride=win.clientWidth+parseFloat(style.columnGap);R.leaves=+style.columnCount;
  flow.style.transform='none';
  R.pages=Math.max(1,Math.ceil((flow.scrollWidth+parseFloat(style.columnGap)-1)/R.stride));
  $('#page-select').innerHTML=Array.from({length:R.pages},(_,i)=>'<option value="'+i+'">'+(i*R.leaves+1)+(R.leaves>1?'–'+(i*R.leaves+R.leaves):'')+'</option>').join('');
  let page=hint==='end'?R.pages-1:typeof hint==='number'?hint:0;
  if(anchor){const p=flow.querySelector('[data-para="'+anchor.pi+'"]');if(p){const range=rangeFor(p,anchor.offset||0,(anchor.offset||0)+1);const rect=range?.getBoundingClientRect()||p.getClientRects()[0];if(rect)page=Math.floor((rect.left-win.getBoundingClientRect().left)/R.stride)}}
  const companion={mode:R.mode,person:R.person,selected:R.selected};
  setPage(page,false);
  R.mode=companion.mode;R.person=companion.person;if(R.visible.includes(companion.selected))R.selected=companion.selected;updateDock();
}
function visibleRect(rect){const win=$('#folio-window').getBoundingClientRect();return rect.width>0&&rect.right>win.left+1&&rect.left<win.right-1&&rect.bottom>win.top&&rect.top<win.bottom}
function rememberPage(){
  const ps=[...$('#folio-flow').querySelectorAll('p')];
  for(const p of ps){
    if(![...p.getClientRects()].some(visibleRect))continue;
    const text=textWalk(p).map(([n])=>n.data).join('');
    // A paragraph may span several pages; save a text offset, not a viewport page number.
    for(let offset=0;offset<text.length;offset+=32){
      const range=rangeFor(p,offset,Math.min(text.length,offset+32));
      if(range&&[...range.getClientRects()].some(visibleRect)){
        for(let exact=offset;exact<Math.min(text.length,offset+32);exact++){
          const char=rangeFor(p,exact,exact+1);
          if(char&&[...char.getClientRects()].some(visibleRect)){R.anchor={id:R.id,pi:+p.dataset.para,offset:exact};store.set('position',R.anchor);return}
        }
      }
    }
  }
}
function finishPaperTurn(){
  if(!paperTurn)return;
  const current=paperTurn;paperTurn=null;
  current.animations.forEach(a=>a.cancel());current.layer.remove();
}
function capturePaper(){
  finishPaperTurn();
  if(!window.matchMedia('(prefers-reduced-motion: no-preference)').matches)return null;
  const stage=$('#voyage .book-surface');if(!stage)return null;
  const copy=stage.cloneNode(true),rect=stage.getBoundingClientRect();
  copy.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  copy.querySelectorAll('button,select,a,.ann').forEach(el=>el.tabIndex=-1);
  copy.classList.add('paper-copy');copy.style.width=rect.width+'px';copy.style.height=rect.height+'px';
  copy.inert=true;copy.setAttribute('aria-hidden','true');
  return {copy,width:rect.width,height:rect.height,leaves:R.leaves};
}
function flipPaper(outgoing,dir){
  const incoming=capturePaper(),stage=$('#voyage .book-surface');if(!incoming||!stage)return;
  const two=outgoing.leaves===2,w=outgoing.width,leafWidth=two?w/2:w;
  const layer=document.createElement('div');layer.className='paper-turn';layer.inert=true;layer.setAttribute('aria-hidden','true');
  const face=(copy,offset)=>{const host=document.createElement('div');host.className='paper-face';copy.style.left=(-offset)+'px';host.append(copy);return host};
  if(two){const still=face(outgoing.copy.cloneNode(true),dir>0?0:w/2);still.classList.add('paper-still');still.style.width=leafWidth+'px';still.style.left=(dir>0?0:w/2)+'px';layer.append(still)}

function edgeList(){
  const seen=new Set(), out=[];
  for(const b in D.incoming) for(const a of D.incoming[b]){
    const k=a+'>'+b; if(a===b||seen.has(k)) continue; seen.add(k); out.push([a,b]);
  }
  return out;
}
function wrapTitle(t){

    if((cur+' '+w).trim().length<=15) lines[lines.length-1]=(cur+' '+w).trim();
    else if(lines.length<2) lines.push(w);

  return lines;
}
let mapBuiltW=0;
function buildMap(){
  const host=document.getElementById('cmap'); if(!host) return;
  const W=host.clientWidth||900; mapBuiltW=W;
  const cell=Math.max(118,Math.min(180,W/Math.max(3,Math.floor(W/150))));
  const perRow=Math.max(3,Math.floor(W/cell));
  const rowH=104, mTop=44, mBot=40, mSide=Math.max(10,(W-perRow*cell)/2);
  const pos={};
  CH.forEach((c,i)=>{
    const r=Math.floor(i/perRow), k=i%perRow, kk=(r%2? perRow-1-k : k);
    pos[c.id]={x:mSide+(kk+0.5)*cell, y:mTop+r*rowH, i, r};
  });
  const H=mTop+Math.ceil(CH.length/perRow)*rowH+mBot;
  const mvOfI=i=>MV.findIndex(m=>i>=m.from&&i<=m.to);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart of the voyage">';
  // faint cross-reference arcs
  svg+='<g id="cmedges">';
  for(const [a,b] of edgeList()){
    const A=pos[a],B=pos[b]; if(!A||!B) continue;
    const dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1;
    const k=Math.min(110,20+d*0.16), nx=-dy/d*k, ny=dx/d*k;
    svg+='<path class="cm-edge" data-a="'+a+'" data-b="'+b+'" d="M'+A.x+' '+A.y+' Q'+((A.x+B.x)/2+nx)+' '+((A.y+B.y)/2+ny)+' '+B.x+' '+B.y+'"/>';
  }
  svg+='</g>';
  // the dotted trail, in reading order
  svg+='<path class="cm-trail" d="'+CH.map((c,i)=>(i?'L':'M')+pos[c.id].x+' '+pos[c.id].y).join(' ')+'"/>';
  // movement label where each water begins
  MV.forEach(m=>{ const P=pos[CH[m.from].id]; svg+='<text class="cm-mv" x="'+P.x+'" y="'+(P.y-22)+'" text-anchor="middle" font-size="9">'+esc(m.name.toUpperCase())+'</text>'; });
  // nodes
  CH.forEach((c,i)=>{
    const P=pos[c.id], mi=mvOfI(i);
    const lines=wrapTitle(c.title);
    svg+='<g class="cm-node" data-id="'+c.id+'" tabindex="0" role="link" aria-label="'+esc(named(c))+'">';
    svg+='<circle cx="'+P.x+'" cy="'+P.y+'" r="11.5" fill="var(--m'+(mi%7)+')"/>';
    svg+='<text class="num" x="'+P.x+'" y="'+P.y+'" text-anchor="middle" dominant-baseline="central" font-size="9.5">'+(c.num||'·')+'</text>';
    lines.forEach((ln,li)=>{ svg+='<text class="ttl" x="'+P.x+'" y="'+(P.y+27+li*13)+'" text-anchor="middle" font-size="11">'+esc(ln)+'</text>'; });
    svg+='</g>';
  });
  svg+='</svg>';
  host.innerHTML=svg;
  const el=host.firstChild;
  const focus=id=>{
    el.classList.add('focus');
    const touched=new Set([id]);
    el.querySelectorAll('.cm-edge').forEach(e=>{
      const hit=e.dataset.a===id||e.dataset.b===id;
      e.classList.toggle('lit',hit);
      if(hit){ touched.add(e.dataset.a); touched.add(e.dataset.b); }
    });
    el.querySelectorAll('.cm-node').forEach(nd=>{ nd.classList.toggle('lit',touched.has(nd.dataset.id)&&nd.dataset.id!==id); nd.classList.toggle('src',nd.dataset.id===id); });
  };
  const blur=()=>{ el.classList.remove('focus'); el.querySelectorAll('.lit,.src').forEach(x=>x.classList.remove('lit','src')); };
  el.querySelectorAll('.cm-node').forEach(nd=>{
    nd.addEventListener('mouseenter',()=>focus(nd.dataset.id));
    nd.addEventListener('mouseleave',blur);
    nd.addEventListener('focus',()=>focus(nd.dataset.id));
    nd.addEventListener('blur',blur);
    nd.addEventListener('click',()=>go(nd.dataset.id));
    nd.addEventListener('keydown',e=>{if(e.key==='Enter') go(nd.dataset.id)});
  });
}

  const snt=A.sents.find(s=>t>=s.t0&&t<s.t1) || null;
  if(snt!==curSent){ curSent=snt; if(CSS.highlights){ const r=snt&&rangeFor(snt.p,snt.cs,snt.ce); if(r) CSS.highlights.set('narr',new Highlight(r)); else CSS.highlights.delete('narr'); }
    if(snt && document.body.classList.contains('on-reader')){ revealPassage(snt.p,snt.cs); } else if(snt && Date.now()-A.lastScroll>1500){ const rg=rangeFor(snt.p,snt.cs,snt.ce); const rc=rg?rg.getBoundingClientRect():snt.p.getBoundingClientRect(); const top=$('.mast').offsetHeight; const bottomPad=($('#abar').offsetHeight||0)+($('#sheet').classList.contains('on')?$('#sheet').offsetHeight:0)+24; if(rc.top<top+16||rc.bottom>innerHeight-bottomPad){ A.programmatic=true; window.scrollBy({top:rc.top-(top+Math.max(80,(innerHeight-top-bottomPad)*0.3)),behavior:'smooth'}); setTimeout(()=>{A.programmatic=false},900); } }
  }
  if(CSS.highlights){ const w=A.words.find(w=>t>=w.t0&&t<w.t1); const r=w&&rangeFor(w.p,w.cs,w.ce); if(r) CSS.highlights.set('narrword',new Highlight(r)); }
  if($('#apause').checked && !A.el.paused){
    const st=A.stops.find(x=>!A.fired.has(x.n) && t>=x.t && t<x.t+1.2);
    if(st){ A.fired.add(st.n); holdForNote(st); }
  }
}
function holdForNote(st){
  A.el.pause(); A.paused=true;
  const a=document.querySelector('#voyage .ann[data-n="'+st.n+'"]');
  if(a){ revealPassage(a); selectNote(st.n); document.querySelectorAll('#voyage .hot').forEach(x=>x.classList.remove('hot')); document.querySelectorAll('#voyage [data-n="'+st.n+'"]').forEach(x=>x.classList.add('hot')); if(innerWidth<=1180 && A.notes && A.notes[st.n]) openSheet(a, A.notes[st.n]); }
  const resume=()=>{ if(!A.paused) return; A.paused=false; closeSheet(); document.querySelectorAll('#voyage .hot').forEach(x=>x.classList.remove('hot')); audioPlay(); };
  const note=D.commentary[A.ch]&&D.commentary[A.ch].annotations; // spoken note, if we have one
  const tts=D.tts&&D.tts[A.ch]&&D.tts[A.ch][st.n];
  if(tts){ const v=new Audio(tts); v.playbackRate=A.el.playbackRate; v.addEventListener('ended',resume,{once:true}); v.play().catch(()=>{ A.holdTimer=setTimeout(resume,5000); }); A.voice=v; }
  else { A.holdTimer=setTimeout(resume, innerWidth<=1180?8000:5000); }
  $('#aplay').textContent='▶';
}
function audioPlay(){ clearTimeout(A.holdTimer); A.paused=false; if(A.voice){A.voice.pause();A.voice=null;} A.el.play().then(()=>{$('#aplay').textContent='❚❚'}).catch(()=>{}); }
function audioPause(){ A.el.pause(); $('#aplay').textContent='▶'; }
function updateBar(){ const d=A.el.duration||0, t=A.el.currentTime||0; $('#atime').innerHTML=fmtTime(t)+'<span class="dur"> / '+fmtTime(d)+'</span>'; $('#afill').style.width=(d?t/d*100:0)+'%'; }
$('#aplay').addEventListener('click',()=>{ if(A.el.paused) audioPlay(); else audioPause(); });
$('#arate').addEventListener('change',e=>{ A.el.playbackRate=+e.target.value; if(A.voice) A.voice.playbackRate=+e.target.value; });
$('#abarline').addEventListener('click',e=>{ const r=e.currentTarget.getBoundingClientRect(); if(A.el.duration){ A.el.currentTime=(e.clientX-r.left)/r.width*A.el.duration; A.fired.clear(); } });
A.el.addEventListener('timeupdate',onTime); A.el.addEventListener('play',()=>$('#aplay').textContent='❚❚'); A.el.addEventListener('pause',()=>{ if(!A.paused) $('#aplay').textContent='▶'; });
A.el.addEventListener('ended',()=>{ $('#aplay').textContent='▶'; });
window.addEventListener('scroll',()=>{ if(!A.programmatic) A.lastScroll=Date.now() },{passive:true});
new ResizeObserver(()=>document.documentElement.style.setProperty('--abar-h',($('#abar').classList.contains('on')?$('#abar').offsetHeight:0)+'px')).observe($('#abar'));
// keep the sheet's close from fighting the hold: closing the sheet during a hold resumes
$('#sheetx').addEventListener('click',()=>{ if(A.paused){ clearTimeout(A.holdTimer); A.paused=false; audioPlay(); } });
$('#sheetscrim').addEventListener('click',()=>{ if(A.paused){ clearTimeout(A.holdTimer); A.paused=false; audioPlay(); } });

/* ---- routing ---- */
function go(id, push=true, q=null, pageHint=null){
  if(id==='home' && !EMBED){ location.href=location.pathname; return; }
  if(byId[id]==null){folioObserver?.disconnect();clearTimeout(readerResize)}
  closeSheet(); setResources(false); setChart(false);
  document.body.classList.toggle('on-reader',byId[id]!=null);
  document.documentElement.style.setProperty('--mast-h',$('.mast').offsetHeight+'px');
  window.scrollTo({top:0,behavior:'auto'});
  document.body.classList.toggle('on-cover', id==='cover'||id==='home');
  document.body.classList.toggle('at-home', id==='home');
  if(id==='cover'||id==='home'){ A.ch=null; A.el.pause(); clearTimeout(A.holdTimer); if(A.voice){A.voice.pause();A.voice=null;} $('#abar').classList.remove('on'); document.body.classList.remove('has-audio'); }
  if(id==='home'){ renderHome(); markChart(null); setChart(false); }
  else if(id==='cover'){ renderCover(); markChart(null); setChart(false); }
  else { showTab('voyage'); renderChapter(id,pageHint); last=id; store.set('last',id); markChart(id); }
  showTab('voyage');
  if(push) history.replaceState(null,'','#'+id);
  if(q){
    const needle=q.toLowerCase();
    const target=[...document.querySelectorAll('#voyage .ann')].find(a=>a.textContent.toLowerCase().includes(needle))
      || [...document.querySelectorAll('#voyage .row p')].find(p=>p.textContent.toLowerCase().includes(needle));
    if(target){ const p=target.closest('p'); const off=p?(q?textWalk(p).map(([n])=>n.data).join('').toLowerCase().indexOf(needle):0):0; revealPassage(p||target,Math.max(0,off)); target.classList.add('flash'); const n=target.dataset.n; if(n) document.querySelectorAll('#voyage [data-n="'+n+'"]').forEach(x=>x.classList.add('hot')); setTimeout(()=>target.classList.remove('flash'),2400); }
  }
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a.xref'); if(!a) return; e.preventDefault();
  go(a.dataset.go,true,a.dataset.q||null);
});
function showTab(t){
  document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+t));
}
document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.addEventListener('click',()=>{showTab(b.dataset.tab); window.scrollTo(0,0)}));
function openSheet(a, note){
  if(document.body.classList.contains('on-reader')){ selectNote(+a.dataset.n); return; }
  document.querySelectorAll('#voyage .ann.open').forEach(x=>x.classList.remove('open')); a.classList.add('open');
  $('#sheetq').textContent=a.dataset.n+' · “'+(note.quote.length>70?note.quote.slice(0,68)+'…':note.quote).replace(/_/g,'')+'”';
  $('#sheetb').innerHTML=fmt(note.note);
  $('#sheet').classList.add('on'); $('#sheetscrim').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheetscrim').classList.remove('on'); document.querySelectorAll('.ann.open').forEach(x=>x.classList.remove('open')); }
$('#sheetx').addEventListener('click',closeSheet); $('#sheetscrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); setChart(false); setResources(false); } });
function setChart(open){ $('#chart').inert=!open; $('#chart').classList.toggle('open',open); $('#scrim').classList.toggle('on',open); }
$('#scrim').addEventListener('click',()=>{setChart(false);setResources(false)});
const mastRO=new ResizeObserver(()=>document.documentElement.style.setProperty('--mast-h',$('.mast').offsetHeight+'px')); mastRO.observe($('.mast'));
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea,[contenteditable="true"]')||e.ctrlKey||e.metaKey||e.altKey) return;
  const cur=location.hash.slice(1); const i=byId[cur]; if(i==null) return;
  if(e.key==='ArrowRight'){e.preventDefault();turnPage(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();turnPage(-1)}
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1); if(id==='home'||id==='cover'||byId[id]!=null) go(id,false)});
document.getElementById('brand').addEventListener('click',e=>{e.preventDefault(); go('home')});

/* ---- find ---- */
let ft;
$('#find').addEventListener('input',e=>{
  clearTimeout(ft); ft=setTimeout(()=>{
    const q=e.target.value.trim().toLowerCase(); const hits=$('#hits'); const list=$('#chartlist');
    if(q.length<3){hits.hidden=true; list.hidden=false; return}
    const res=[];
    for(const c of CH){ for(const p of c.paras){ const k=p.toLowerCase().indexOf(q); if(k>=0){ res.push({c, p, k}); if(res.length>=40) break; } } if(res.length>=40) break; }
    hits.innerHTML = res.length? res.map(r=>{const s=Math.max(0,r.k-60), e2=Math.min(r.p.length,r.k+q.length+80); const snip=esc(r.p.slice(s,r.k))+'<mark>'+esc(r.p.slice(r.k,r.k+q.length))+'</mark>'+esc(r.p.slice(r.k+q.length,e2)); return '<li><button data-go="'+r.c.id+'"><b>'+esc(named(r.c))+'</b>…'+snip+'…</button></li>'}).join('') : '<li class="none">nothing in the book matches that</li>';
    hits.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.go,true,q); setChart(false)}));
    hits.hidden=false; list.hidden=true;
  },160);
});

/* ---- boot ---- */
renderChart(); renderCrew(); renderAbout(); renderRail(); setChart(false);
const h0=location.hash.slice(1);
if(h0==='read') go(byId[last]!=null?last:CH[0].id,false); else if(byId[h0]!=null||h0==='cover') go(h0,false); else go('cover',false);
})();
</script>
